name: Keep scheduled workflows alive

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Touch keepalive marker
        run: date -u +%Y-%m-%dT%H:%M:%SZ > .github/keepalive.txt

      - name: Commit keepalive marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git diff --cached --quiet || git commit -m "chore: keep scheduled workflows alive"
          git push
