[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "social-auto-poster"
version = "0.1.0"
description = "Self-hosted, multi-platform social media auto-poster"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.170,<3",
  "google-auth>=2.40,<3",
  "python-dotenv>=1.1,<2",
  "requests>=2.32,<3",
]

[project.scripts]
social-auto-poster = "social_autoposter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
